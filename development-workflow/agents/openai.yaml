interface:
  display_name: "开发计划与实施"
  short_description: "自动承接开发与计划请求，默认普通模式，支持专业模式和可追溯实施验证"
  default_prompt: "使用 $development-workflow 生成开发计划，未指定时采用普通模式直接承接自然语言需求，依据页面需求和既有方案判断是否需要原型；按需求与交付总览、总体实施方案、开发任务与实施顺序、测试验证与业务验收、发布回退与交付组织内容，说明共用方案的用途与适用任务，将现状依据就地关联方案，建立逐项可操作的验收与状态映射。"
policy:
  allow_implicit_invocation: true
